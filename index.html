    const hx=h.x+(h.offset||0), hy=(h.y||GROUND-10)+(h.offsetY||0);

  }
  function hazardContactAlongPath(h, prevX, prevY, x, y) {
    const hx=h.x+(h.offset||0), hy=(h.y||GROUND-10)+(h.offsetY||0);
    const radius=h.air ? h.w+15 : h.w+20;
    const distance=Math.abs(x-hx);
    const top=y-34, bottom=y-4, prevTop=prevY-34, prevBottom=prevY-4, half=(h.hitH||16)/2;
    const verticalNow=top < hy+half && bottom > hy-half;
    const verticalPrev=prevTop < hy+half && prevBottom > hy-half;
    const groundNow=y>GROUND-40, groundPrev=prevY>GROUND-40;
    const touchingNow=h.air ? (distance<radius && verticalNow) : (distance<radius && groundNow);
    const minX=Math.min(prevX,x), maxX=Math.max(prevX,x);
    const crossesX=minX<=hx+radius && maxX>=hx-radius;
    const verticalPath=h.air ? (verticalNow||verticalPrev) : (groundNow||groundPrev);
    const sweptTouching=crossesX && verticalPath;
    const dx=x-prevX;
    let entryT=Infinity;
    if (touchingNow || sweptTouching) {
      if (Math.abs(prevX-hx)<=radius) entryT=0;
      else if (Math.abs(dx)>1e-6) {
        const boundary=dx>0 ? hx-radius : hx+radius;
        const t=(boundary-prevX)/dx;
        if(t>=0&&t<=1) entryT=t;
        else if(touchingNow) entryT=1;
      } else if(touchingNow) entryT=0;
    }
    const near=h.air ? (distance<(h.w+34)&&verticalNow) : (distance<(h.w+54)&&distance>=(h.w+20)&&groundNow);
    return {h,hx,hy,distance,touchingNow,sweptTouching,entryT,near,verticalNow};
  }

  function updateMobileHud(){
    const hud=document.getElementById('mobileHud');
    if(!hud) return;
    const mobile=document.body.classList.contains('touch-layout');
    const flightMode=mode==='flight'||(mode==='paused'&&pausedFrom==='flight');
    const targets=document.getElementById('mobileFlightTargets');
    if(targets){targets.classList.toggle('active',mobile&&flightMode);targets.setAttribute('aria-hidden',String(!(mobile&&flightMode)));}
    const active=mobile && (mode==='play'||mode==='flight'||mode==='paused');
    hud.classList.toggle('active',active);
    hud.classList.toggle('sporophyte',stage==='sporophyte');
    hud.classList.toggle('flight',flightMode);
    hud.setAttribute('aria-hidden',String(!active));
    if(!active) return;
    const stageLabel=flightMode?'SPORE FLIGHT':(stage==='gametophyte'?'HAP · GAMETOPHYTE':'DIPLO · SPOROPHYTE');
    document.getElementById('mobileStage').textContent=stageLabel;
    document.getElementById('mobileLives').textContent=`♥ ${lives}`;
    document.getElementById('mobileScore').textContent=`${score} PTS`;
    const objective=document.getElementById('mobileObjective');
    const resourceCount=document.getElementById('mobileResourceCount');
    const cycle=document.getElementById('mobileCycles');
    if(flightMode){
      const gust=activeFlightGust();
      const gustDir=gust?(gust.direction<0?'←':'→'):(flight.breeze<0?'←':'→');
      objective.textContent=gust?(flight.time<gust.startAt?`GUST ${gustDir} SOON`:`GUST ${gustDir} NOW`):'STEER ← →';
      resourceCount.textContent=`${Math.max(0,flight.timer).toFixed(1)}s`;
      const laneLayout=flight.landingLayout||getLandingLayout(cycles).lanes;
      const soilLane=FLIGHT_LANE_NAMES[laneLayout.indexOf('soil')].toUpperCase();
      cycle.textContent=`SOIL ${soilLane} · LAYOUT ${(flight.layoutIndex??getLandingLayout(cycles).index)+1}/6`;
      if(targets){
        targets.querySelectorAll('.mobile-flight-target').forEach(el=>{
          const index=Number(el.dataset.lane);const type=laneLayout[index];const info=SUBSTRATE_INFO[type];
          el.classList.remove('soil','rock','concrete');el.classList.add(type);
          const strong=el.querySelector('strong'),span=el.querySelector('span');
          if(strong)strong.textContent=info.short;
          if(span)span.textContent=info.subtitle;
        });
      }
    }else{
      const value=stage==='gametophyte'?water:light;
      objective.textContent=stage==='gametophyte'?'DEW':'SUNLIGHT';
      resourceCount.textContent=`${Math.min(3,value)} / 3`;
      cycle.textContent=`LEVEL ${getDifficultyConfig(cycles).level} · ${cycles} CYCLES`;
      document.querySelectorAll('.mobile-pip').forEach((pip,i)=>pip.classList.toggle('filled',i<value));
    }
    const progress=document.getElementById('mobileProgressFill');
    if(progress) progress.style.width=`${100*Math.max(0,Math.min(1,flightMode?flight.timer/7.5:player.x/END))}%`;
  }
  function drawHUD(){
    if(document.body.classList.contains('touch-layout')){updateMobileHud();return;}
    // One quiet, continuous status bar replaces three competing cards.
    roundRect(ctx,22,16,916,78,15,'#122a2adc','#537765',1.2);
    const accent = stage==='gametophyte' ? '#b8f17a' : '#b9e5fb';
    ctx.fillStyle=accent;ctx.font='1000 12px system-ui';ctx.textAlign='left';
    ctx.fillText(stage==='gametophyte'?'HAP  /  GAMETOPHYTE':'DIPLO  /  SPOROPHYTE',39,40);
    ctx.fillStyle='#f5f7df';ctx.font='800 15px system-ui';
    ctx.fillText(stage==='gametophyte'?'Find dew. Reach the egg.':'Find sunlight. Release spores.',39,65);
    ctx.strokeStyle='#45695a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(365,29);ctx.lineTo(365,80);ctx.moveTo(690,29);ctx.lineTo(690,80);ctx.stroke();
    const value=stage==='gametophyte'?water:light;
    ctx.fillStyle='#d6e4ca';ctx.font='900 11px system-ui';ctx.textAlign='left';
    ctx.fillText(stage==='gametophyte'?'DEW':'SUNLIGHT',391,41);
    ctx.fillStyle='#f7f7df';ctx.font='800 12px system-ui';ctx.fillText(`${Math.min(3,value)} / 3`,640,41);
    for(let i=0;i<3;i++){
      roundRect(ctx,391+i*78,51,64,13,6,i<value?(stage==='gametophyte'?'#a7e8ff':'#ffd55c'):'#39554a');
    }
    ctx.fillStyle='#c5dac6';ctx.font='900 10px system-ui';ctx.textAlign='left';ctx.fillText('LIVES',712,38);
    ctx.fillStyle='#ffb39d';ctx.font='900 15px system-ui';ctx.fillText(`♥ ${lives}`,712,62);
    ctx.fillStyle='#eaf1d6';ctx.font='900 14px system-ui';ctx.textAlign='right';ctx.fillText(`${score} PTS`,920,62);
    ctx.fillStyle='#15332d';ctx.fillRect(22,103,916,4);
    ctx.fillStyle='#aeea77';ctx.fillRect(22,103,916*Math.max(0,Math.min(1,player.x/END)),4);
    ctx.fillStyle='#d7e9d0';ctx.font='800 9px system-ui';ctx.textAlign='left';ctx.fillText(`LEVEL ${getDifficultyConfig(cycles).level} · ${cycles} CYCLES`,24,121);
    ctx.textAlign='right';ctx.fillText(activeBiomePalette.name,936,121);
  }
  function drawFlightLeaf(x,y,rotation=0) {
    ctx.save();ctx.translate(x,y);ctx.rotate(rotation||0);
    ctx.strokeStyle='#6b8b50';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-13,3);ctx.quadraticCurveTo(0,-1,14,-7);ctx.stroke();
    ctx.fillStyle='#9ec56e';ctx.strokeStyle='#e4f3b9';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(-5,-1,9,4.5,-.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(5,-4,10,5,-.45,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#d9efaa';ctx.beginPath();ctx.ellipse(8,-5,3,1.3,-.45,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function drawLandingLane(index,type) {
    const bounds=getLandingLaneBounds(index),info=SUBSTRATE_INFO[type],top=356,bottom=486;
    ctx.fillStyle=info.fill;ctx.fillRect(bounds.left,top,bounds.width,bottom-top);
    ctx.save();ctx.beginPath();ctx.rect(bounds.left,top,bounds.width,bottom-top);ctx.clip();
    // Light texture makes the substrate types recognisable without hiding target text.
    if(type==='soil'){
      ctx.globalAlpha=.22;ctx.fillStyle='#d6f6a9';
      for(let i=0;i<9;i++){const x=bounds.left+15+i*(bounds.width-30)/8;ctx.fillRect(x,top+6,2,bottom-top-10);}
      ctx.globalAlpha=1;
      for(let i=0;i<6;i++){
        const x=bounds.left+20+i*(bounds.width-40)/5,y=462+(i%2)*5;
        ctx.strokeStyle='#b5e77a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+10);ctx.quadraticCurveTo(x-2,y,x-8,y-3);ctx.moveTo(x,y+10);ctx.quadraticCurveTo(x+2,y,x+8,y-5);ctx.stroke();
      }
    } else if(type==='rock'){
      for(let i=0;i<11;i++){
        const x=bounds.left+12+(i*37)%(Math.max(1,bounds.width-24));const y=450+(i%3)*8;
        ctx.fillStyle=i%2?'#707d6b':'#b0b49a';ctx.beginPath();ctx.moveTo(x-7,y+4);ctx.lineTo(x-3,y-4-(i%2)*3);ctx.lineTo(x+4,y-6);ctx.lineTo(x+9,y+3);ctx.closePath();ctx.fill();
      }
    } else {
      ctx.globalAlpha=.36;ctx.strokeStyle='#e7f0eb';ctx.lineWidth=2;
      for(let i=0;i<4;i++){const x=bounds.left+24+i*78;ctx.beginPath();ctx.moveTo(x,451);ctx.lineTo(x+8,458);ctx.lineTo(x+1,466);ctx.lineTo(x+10,474);ctx.stroke();}
      ctx.globalAlpha=1;
      ctx.strokeStyle='#687674';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bounds.left+10,top+12);ctx.lineTo(bounds.right-10,top+12);ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle=info.stroke;ctx.lineWidth=2;ctx.strokeRect(bounds.left,top,bounds.width,bottom-top);
    ctx.fillStyle=type==='soil'?'#efffd5':'#fff8e8';ctx.textAlign='center';ctx.font='1000 13px system-ui';ctx.fillText(info.title,bounds.centre,397);
    ctx.fillStyle=info.stroke;ctx.font='900 11px system-ui';ctx.fillText(info.subtitle,bounds.centre,419);
  }
  function drawFlight(){
    const mobile=document.body.classList.contains('touch-layout');
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#203b55');g.addColorStop(.65,'#b6d7d9');g.addColorStop(1,'#e8edcf');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff2bf';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(790,95,40,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    for(let i=0;i<13;i++){const x=(i*103+flight.time*28)%1100-70;const y=70+(i*47)%240;ctx.strokeStyle='#ffffff8c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+22,y-7,x+44,y+8,x+65,y);ctx.stroke();}

    // The same lane data drives both visible substrate labels and the landing outcome.
    const layout=flight.landingLayout||getLandingLayout(cycles).lanes;
    ctx.fillStyle='#335d45';ctx.fillRect(FLIGHT_LANE_START,350,FLIGHT_LANE_END-FLIGHT_LANE_START,136);
    for(let lane=0;lane<3;lane++)drawLandingLane(lane,layout[lane]);

    // Gusts are telegraphed before their force is applied, so players can react.
    const gust=activeFlightGust();
    if(gust&&flight.time>=gust.startAt){
      ctx.save();ctx.globalAlpha=.30;ctx.strokeStyle='#f5fff0';ctx.lineWidth=3;ctx.lineCap='round';
      for(let j=0;j<5;j++){
        const gy=125+j*22;const start=gust.direction<0?W-20:20;const end=gust.direction<0?20:W-20;
        ctx.beginPath();ctx.moveTo(start,gy);ctx.bezierCurveTo(start+gust.direction*55,gy-8,start+gust.direction*95,gy+8,start+gust.direction*145,gy);ctx.stroke();
        ctx.fillStyle='#f5fff0';ctx.beginPath();const ax=start+gust.direction*145;ctx.moveTo(ax,gy);ctx.lineTo(ax-gust.direction*10,gy-5);ctx.lineTo(ax-gust.direction*10,gy+5);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }
    // A single or paired drifting leaf is introduced only after basic flight is familiar.
    for(const leaf of (flight.leaves||[])){
      if(flight.time<leaf.startAt)continue;
      const lx=leaf.startX+leaf.direction*leaf.speed*(flight.time-leaf.startAt);
      if(lx>-45&&lx<W+45)drawFlightLeaf(lx,leaf.y,Math.sin(flight.time*4+leaf.id)*.38);
    }

    if(windbreakTimer>0){ctx.save();ctx.globalAlpha=.22+Math.sin(flight.time*16)*.05;ctx.strokeStyle='#faffdc';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.ellipse(flight.x,flight.y,40,28,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
    // Spore cloud.
    ctx.save();ctx.translate(flight.x,flight.y);ctx.rotate(Math.sin(flight.time*2)*.09);
    for(let i=0;i<12;i++){const a=i*2.399;const r=5+(i%4)*5;const x=Math.cos(a)*r,y=Math.sin(a)*r;ctx.fillStyle=i%3?'#fff7d8':'#d1ef9d';ctx.beginPath();ctx.arc(x,y,4+(i%2),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-5,y-3);ctx.lineTo(x+5,y+3);ctx.stroke();}
    ctx.restore();

    if(!mobile){
      roundRect(ctx,22,19,530,75,16,'#15302be8','#f0f6d1',1.5);ctx.fillStyle='#d8f5a7';ctx.font='1000 13px system-ui';ctx.textAlign='left';ctx.fillText('SPORE FLIGHT  /  CHOOSE YOUR LANDING',40,44);ctx.fillStyle='#fff9e8';ctx.font='800 17px system-ui';ctx.fillText('Steer ← →. Press SPACE to land early.',40,70);
      roundRect(ctx,570,24,232,58,12,'#15302be8','#f0f6d1',1.2);
      const gustWarning=gust&&flight.time<gust.startAt;
      const direction=gust?gust.direction:(flight.breeze>=0?1:-1);
      ctx.fillStyle=gustWarning?'#ffd98d':'#cbeac4';ctx.font='1000 10px system-ui';ctx.textAlign='left';ctx.fillText(gustWarning?'GUST INCOMING':gust?'CROSSWIND ACTIVE':'AIRFLOW',585,44);
      ctx.fillStyle='#fff9e8';ctx.font='1000 21px system-ui';ctx.textAlign='right';ctx.fillText(direction<0?'←':'→',785,65);
      ctx.fillStyle='#e4f0dd';ctx.font='800 9px system-ui';ctx.textAlign='left';ctx.fillText(windbreakTimer>0?'WINDBREAK ACTIVE':gustWarning?'Prepare to correct drift':gust?'Steer against the gust':'Gentle changing breeze',585,65);
      roundRect(ctx,820,24,118,58,14,'#15302be8','#f0f6d1',1.5);ctx.fillStyle='#f9f0cf';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('TIME TO LAND',879,43);ctx.fillStyle='#fff';ctx.font='1000 23px system-ui';ctx.fillText(Math.max(0,flight.timer).toFixed(1)+'s',879,68);
      ctx.fillStyle='#fffdf0';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText('CHOOSE THE MOIST, SHELTERED SOIL — ITS POSITION CHANGES',W/2,514);
    }
  }
  function drawMenuBackground(){
    drawBackground();ctx.save();ctx.translate(-cameraX,0);drawGround();
    for(let i=0;i<9;i++){drawDew(170+i*195,300+(i%3)*45,i);}
    drawMoss(330,GROUND,0);drawFern(650,GROUND,0);ctx.restore();
    ctx.fillStyle='#f9f3d7';ctx.font='1000 15px system-ui';ctx.textAlign='center';ctx.fillText('A LIFE CYCLE GAME ABOUT PLANTS WITH GENERATIONAL DRAMA',W/2,490);
  }
  function drawToast(){ /* Notifications are rendered by the shared, wrapping HTML bubble on desktop and mobile. */ }
  function render(){
    syncResponsiveLayout();
    ctx.clearRect(0,0,W,H);
    if(mode==='flight' || (mode==='paused' && pausedFrom==='flight')){drawFlight();updateMobileHud();drawToast();}
    else if(mode==='menu'){cameraX=0;drawMenuBackground();updateMobileHud();}
    else {drawBackground();drawWorld();drawHUD();drawToast();}
  }
  function frame(t){const dt=Math.min(.033,Math.max(0,(t-lastTime)/1000||0));lastTime=t;if(mode!=='paused')update(dt);else {for(const k of Object.keys(justPressed))delete justPressed[k];}render();requestAnimationFrame(frame);}
  showIntro();
  requestAnimationFrame(frame);

  let deferredInstallPrompt = null;
  const installGameBtn = document.getElementById('installGameBtn');
  const appIsInstalled = () => Boolean((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true);
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    if (installGameBtn && !appIsInstalled()) installGameBtn.hidden = false;
  });
  if (installGameBtn) installGameBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) {
      toastMsg('On iPhone or iPad, open this game in Safari and use Share → Add to Home Screen.', 6, {category:'important'});
      return;
    }
    try {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installGameBtn.hidden = true;
      if (choice && choice.outcome === 'accepted') toastMsg('GENERATION GAP INSTALLED. Hap has secured permanent desk space.', 4, {category:'important'});
    } catch (error) {
      toastMsg('Use your browser menu to install or add this game to your Home Screen.', 5, {category:'important'});
    }
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if (installGameBtn) installGameBtn.hidden = true;
    toastMsg('GENERATION GAP INSTALLED. The fern has acquired a permanent address.', 4, {category:'important'});
  });
  if (installGameBtn && appIsInstalled()) installGameBtn.hidden = true;

  // PWA registration is optional and deliberately skipped for file:// play.
  // A standalone HTML copy works without any companion assets or server.
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(new URL('./service-worker.js', location.href).toString(), {scope:'./'})
        .catch(() => { /* Core gameplay remains available even if the PWA layer is unavailable. */ });
    }, {once:true});
  }
  // The opening briefing is built by the same overlay system used throughout the game.
})();
</script>
